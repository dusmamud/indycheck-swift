name: Verify

# Verifies the Swift package end to end on macOS: a throwaway test package
# depends on this repo, builds, and runs a smoke test (validatePan,
# validateVehicle, detect). With a `release_tag` input, the tag is created
# ONLY after the branch-main smoke test passes, and the smoke test is then
# run a second time resolving the package from the exact new tag — so a
# green tag run proves the published version itself resolves and works.
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to create after the smoke test passes (e.g. 0.2.3). Leave empty to only verify.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Check out indycheck-swift
        uses: actions/checkout@v4

      - name: Smoke test against branch main
        run: |
          bash scripts/smoke-test.sh '.package(url: "https://github.com/dusmamud/indycheck-swift", branch: "main")'

      # Runs ONLY after the smoke test above passes (steps run in order).
      - name: Create release tag
        if: ${{ inputs.release_tag != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.release_tag }}"
          git push origin "${{ inputs.release_tag }}"

      # Final proof: resolve the package from the exact tag just created.
      - name: Smoke test against exact version
        if: ${{ inputs.release_tag != '' }}
        run: |
          bash scripts/smoke-test.sh '.package(url: "https://github.com/dusmamud/indycheck-swift", exact: "${{ inputs.release_tag }}")'
